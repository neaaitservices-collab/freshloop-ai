# Applies pending Prisma migrations to the production Supabase database.
# Requires repository secrets: DATABASE_URL, DIRECT_URL (production values).

name: Database migrate (production)

# Manual only. Merging schema to main must not migrate production by itself.
on:
  workflow_dispatch:

concurrency:
  group: production-database-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: prisma migrate deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify database secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add GitHub secret DATABASE_URL (Supabase pooler, port 6543). See docs/DEPLOYMENT.md."
            exit 1
          fi
          if [ -z "$DIRECT_URL" ]; then
            echo "::warning::DIRECT_URL secret is empty; migrate script will derive a direct URL from DATABASE_URL."
          fi

      - name: Apply migrations
        run: npm run db:push:prod
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
